<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1160" viewBox="0 0 1480 1160" role="img" aria-labelledby="title desc">
<title id="title">Nine-candidate target scorer and conditional action mask</title><desc id="desc">Ordered entity embeddings form nine target candidates. Hero candidates use the final 32 dimensions; enemy minion embeddings are unpooled. A shared bias-free 32-to-32 transform and an LSTM 512-to-32 query produce dot-product logits. The selected button chooses one row from a 12-by-9 legal-target mask before masked softmax.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#19324b}.title{font-size:31px;font-weight:700}.sub{font-size:19px;fill:#52657b}.label{font-size:19px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#52657b}.dim{font-size:23px;font-weight:700}.line{fill:none;stroke:#64748b;stroke-width:2}.shared{fill:#eaf3ff;stroke:#8fb4e4;stroke-width:1.6}.side{fill:#f0f8f3;stroke:#8ebfa3;stroke-width:1.6}.pool{fill:#fff5e3;stroke:#d8b56a;stroke-width:1.6}.plain{fill:#fff;stroke:#c3cfdb;stroke-width:1.6}.target{fill:#f4efff;stroke:#b09bd8;stroke-width:1.6}.trunk{fill:#e8f6f6;stroke:#77b5b5;stroke-width:1.6}</style></defs>
<rect width="1480" height="1160" rx="20" fill="#f7f9fc"/><text x="45" y="48" class="title" text-anchor="start">Target scorer: entity candidates + recurrent query</text><text x="45" y="81" class="sub" text-anchor="start">Exact candidate order, embedding extraction, dot-product scoring, and button-conditioned legality</text><text x="50" y="130" class="label" text-anchor="start">ORDERED CANDIDATES</text><text x="820" y="130" class="label" text-anchor="start">TARGET REPRESENTATION</text><rect x="50" y="160" width="46" height="46" rx="10" class="target"/><text x="73" y="190" class="label" text-anchor="middle">0</text><rect x="110" y="160" width="370" height="46" rx="10" class="plain"/><text x="295" y="190" class="body" text-anchor="middle">Empty / default target</text><rect x="505" y="160" width="230" height="46" rx="10" class="plain"/><text x="620" y="190" class="small" text-anchor="middle">constant 0.1 × ones(32)</text><path d="M480 183 H505" class="line" marker-end="url(#arrow)"/><path d="M735 183 H770" class="line"/><rect x="50" y="218" width="46" height="46" rx="10" class="target"/><text x="73" y="248" class="label" text-anchor="middle">1</text><rect x="110" y="218" width="370" height="46" rx="10" class="plain"/><text x="295" y="248" class="body" text-anchor="middle">Enemy hero encoding: 128</text><rect x="505" y="218" width="230" height="46" rx="10" class="plain"/><text x="620" y="248" class="small" text-anchor="middle">take final 32 dims</text><path d="M480 241 H505" class="line" marker-end="url(#arrow)"/><path d="M735 241 H770" class="line"/><rect x="50" y="276" width="46" height="46" rx="10" class="target"/><text x="73" y="306" class="label" text-anchor="middle">2</text><rect x="110" y="276" width="370" height="46" rx="10" class="plain"/><text x="295" y="306" class="body" text-anchor="middle">Main hero encoding: 128</text><rect x="505" y="276" width="230" height="46" rx="10" class="plain"/><text x="620" y="306" class="small" text-anchor="middle">take final 32 dims</text><path d="M480 299 H505" class="line" marker-end="url(#arrow)"/><path d="M735 299 H770" class="line"/><rect x="50" y="334" width="46" height="46" rx="10" class="target"/><text x="73" y="364" class="label" text-anchor="middle">3</text><rect x="110" y="334" width="370" height="46" rx="10" class="plain"/><text x="295" y="364" class="body" text-anchor="middle">Enemy minion slot 0</text><rect x="505" y="334" width="230" height="46" rx="10" class="plain"/><text x="620" y="364" class="small" text-anchor="middle">unpooled 32 dims</text><path d="M480 357 H505" class="line" marker-end="url(#arrow)"/><path d="M735 357 H770" class="line"/><rect x="50" y="392" width="46" height="46" rx="10" class="target"/><text x="73" y="422" class="label" text-anchor="middle">4</text><rect x="110" y="392" width="370" height="46" rx="10" class="plain"/><text x="295" y="422" class="body" text-anchor="middle">Enemy minion slot 1</text><rect x="505" y="392" width="230" height="46" rx="10" class="plain"/><text x="620" y="422" class="small" text-anchor="middle">unpooled 32 dims</text><path d="M480 415 H505" class="line" marker-end="url(#arrow)"/><path d="M735 415 H770" class="line"/><rect x="50" y="450" width="46" height="46" rx="10" class="target"/><text x="73" y="480" class="label" text-anchor="middle">5</text><rect x="110" y="450" width="370" height="46" rx="10" class="plain"/><text x="295" y="480" class="body" text-anchor="middle">Enemy minion slot 2</text><rect x="505" y="450" width="230" height="46" rx="10" class="plain"/><text x="620" y="480" class="small" text-anchor="middle">unpooled 32 dims</text><path d="M480 473 H505" class="line" marker-end="url(#arrow)"/><path d="M735 473 H770" class="line"/><rect x="50" y="508" width="46" height="46" rx="10" class="target"/><text x="73" y="538" class="label" text-anchor="middle">6</text><rect x="110" y="508" width="370" height="46" rx="10" class="plain"/><text x="295" y="538" class="body" text-anchor="middle">Enemy minion slot 3</text><rect x="505" y="508" width="230" height="46" rx="10" class="plain"/><text x="620" y="538" class="small" text-anchor="middle">unpooled 32 dims</text><path d="M480 531 H505" class="line" marker-end="url(#arrow)"/><path d="M735 531 H770" class="line"/><rect x="50" y="566" width="46" height="46" rx="10" class="target"/><text x="73" y="596" class="label" text-anchor="middle">7</text><rect x="110" y="566" width="370" height="46" rx="10" class="plain"/><text x="295" y="596" class="body" text-anchor="middle">Enemy tower encoding</text><rect x="505" y="566" width="230" height="46" rx="10" class="plain"/><text x="620" y="596" class="small" text-anchor="middle">32 dims</text><path d="M480 589 H505" class="line" marker-end="url(#arrow)"/><path d="M735 589 H770" class="line"/><rect x="50" y="624" width="46" height="46" rx="10" class="target"/><text x="73" y="654" class="label" text-anchor="middle">8</text><rect x="110" y="624" width="370" height="46" rx="10" class="plain"/><text x="295" y="654" class="body" text-anchor="middle">Monster encoding</text><rect x="505" y="624" width="230" height="46" rx="10" class="plain"/><text x="620" y="654" class="small" text-anchor="middle">32 dims</text><path d="M480 647 H505" class="line" marker-end="url(#arrow)"/><path d="M735 647 H770" class="line"/><path d="M770 183 V647" class="line"/><path d="M770 299 H815" class="line" marker-end="url(#arrow)"/><rect x="815" y="250" width="220" height="98" rx="10" class="target"/><text x="925" y="293.5" class="body" text-anchor="middle">Stack in slot order</text><text x="925" y="318.5" class="body" text-anchor="middle">E: 9 × 32</text><path d="M1035 299 H1115" class="line" marker-end="url(#arrow)"/><rect x="1115" y="250" width="300" height="98" rx="10" class="target"/><text x="1265" y="281" class="body" text-anchor="middle">Shared Linear</text><text x="1265" y="306" class="body" text-anchor="middle">32 → 32, NO bias</text><text x="1265" y="331" class="body" text-anchor="middle">K: 9 × 32</text><rect x="815" y="416" width="220" height="75" rx="10" class="trunk"/><text x="925" y="448" class="body" text-anchor="middle">LSTM output</text><text x="925" y="473" class="body" text-anchor="middle">h: 512</text><path d="M925 491 V535" class="line" marker-end="url(#arrow)"/><rect x="815" y="535" width="220" height="98" rx="10" class="trunk"/><text x="925" y="566" class="body" text-anchor="middle">Linear + bias</text><text x="925" y="591" class="body" text-anchor="middle">512 → 32</text><text x="925" y="616" class="body" text-anchor="middle">query q: 32</text><path d="M1035 584 H1115" class="line" marker-end="url(#arrow)"/><path d="M1265 348 V535" class="line" marker-end="url(#arrow)"/><rect x="1115" y="535" width="300" height="98" rx="10" class="target"/><text x="1265" y="566" class="body" text-anchor="middle">Dot product per slot</text><text x="1265" y="591" class="body" text-anchor="middle">z[j] = sum(q * K[j])</text><text x="1265" y="616" class="body" text-anchor="middle">9 scores; no scaling</text><path d="M1265 633 V686" class="line" marker-end="url(#arrow)"/><rect x="1115" y="686" width="300" height="70" rx="10" class="target"/><text x="1265" y="728" class="body" text-anchor="middle">Target logits z: 9</text><text x="50" y="734" class="sub" text-anchor="start">Hero slices and minion slots are taken from entity encoder outputs.</text><text x="50" y="763" class="sub" text-anchor="start">The four enemy-minion candidates bypass max pooling.</text><rect x="30" y="801" width="1415" height="312" rx="14" fill="#fff" stroke="#dce4ed"/><text x="50" y="831" class="label" text-anchor="start">CONDITIONAL LEGALITY + NORMALIZATION</text><rect x="55" y="860" width="315" height="75" rx="10" class="plain"/><text x="212.5" y="892" class="body" text-anchor="middle">Environment target mask</text><text x="212.5" y="917" class="body" text-anchor="middle">M: 12 buttons × 9 targets</text><rect x="55" y="980" width="315" height="75" rx="10" class="plain"/><text x="212.5" y="1012" class="body" text-anchor="middle">Selected button b</text><text x="212.5" y="1037" class="body" text-anchor="middle">sampled or argmax button</text><rect x="440" y="902" width="330" height="100" rx="10" class="pool"/><text x="605" y="934" class="body" text-anchor="middle">Select the button row</text><text x="605" y="959" class="body" text-anchor="middle">m = M[b, :]</text><text x="605" y="984" class="body" text-anchor="middle">legal target mask: 9</text><path d="M370 897 H405 V927 H440" class="line" marker-end="url(#arrow)"/><path d="M370 1017 H405 V977 H440" class="line" marker-end="url(#arrow)"/><rect x="825" y="902" width="220" height="100" rx="10" class="pool"/><text x="935" y="946.5" class="body" text-anchor="middle">Apply legal mask</text><text x="935" y="971.5" class="body" text-anchor="middle">m: 9</text><path d="M770 952 H825" class="line" marker-end="url(#arrow)"/><rect x="1115" y="902" width="300" height="100" rx="10" class="target"/><text x="1265" y="934" class="body" text-anchor="middle">Masked softmax</text><text x="1265" y="959" class="body" text-anchor="middle">p = normalize(exp(z)</text><text x="1265" y="984" class="body" text-anchor="middle">over legal targets)</text><path d="M1045 952 H1115" class="line" marker-end="url(#arrow)"/><path d="M1265 756 V902" class="line" marker-end="url(#arrow)"/><path d="M1265 1002 V1040" class="line" marker-end="url(#arrow)"/><rect x="1115" y="1040" width="300" height="52" rx="10" class="target"/><text x="1265" y="1073" class="body" text-anchor="middle">9 target probabilities</text><text x="55" y="1090" class="sub" text-anchor="start">Sample a target during exploration; use argmax for deterministic action.</text><text x="740" y="1142" class="sub" text-anchor="middle">Target mask is selected using the corresponding sampled or deterministic button.</text></svg>
