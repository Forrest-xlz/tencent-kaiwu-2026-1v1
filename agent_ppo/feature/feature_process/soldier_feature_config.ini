[feature_config]
is_alive = one_hot:1:eq
is_visible = one_hot:1:eq
belong_to_main_camp = one_hot:1:eq
location_x = min_max:-10000:10000
location_z = min_max:-41000:41000
self_relative_location_x = min_max:0:1
self_relative_location_z = min_max:0:1
opponent_relative_location_x = min_max:0:1
opponent_relative_location_z = min_max:0:1

dist_to_self_hero = min_max:0:116000
dist_to_opponent_hero = min_max:0:116000
# hp / income, using soldier_vec_feature ranges
hp = min_max:0:12000
hp_rate = min_max:0:1
max_hp = min_max:0:12000
kill_income = min_max:0:150
soldier_type = one_hot:0:1:2:eq

# 是否在敌方攻击范围内
opponent_hero_in_attack_range = one_hot:1:eq


[feature_functions]
is_alive = is_alive
is_visible = is_visible
belong_to_main_camp = belong_to_main_camp
location_x = get_normal_soldier_location_x
location_z = get_normal_soldier_location_z
self_relative_location_x = self_relative_location_x
self_relative_location_z = self_relative_location_z
opponent_relative_location_x = opponent_relative_location_x
opponent_relative_location_z = opponent_relative_location_z
dist_to_self_hero = dist_to_self_hero
dist_to_opponent_hero = dist_to_opponent_hero
# hp / income
hp = hp
hp_rate = hp_rate
max_hp = max_hp
kill_income = kill_income
soldier_type = soldier_type

# 是否在敌方攻击范围内
opponent_hero_in_attack_range = opponent_hero_in_attack_range