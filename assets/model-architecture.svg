<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1685" viewBox="0 0 1480 1685" role="img" aria-labelledby="title desc">
<title id="title">Detailed entity-encoded recurrent actor-critic</title><desc id="desc">Every entity layer is shown separately. Shared hero, minion, and tower layers lead to side-specific projections. Only minions are pooled. A 441-dimensional concatenation feeds a 512-unit LSTM, five categorical action heads, a nine-candidate target scorer, and a scalar value head.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#19324b}.title{font-size:31px;font-weight:700}.sub{font-size:19px;fill:#52657b}.label{font-size:19px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#52657b}.dim{font-size:23px;font-weight:700}.line{fill:none;stroke:#64748b;stroke-width:2}.shared{fill:#eaf3ff;stroke:#8fb4e4;stroke-width:1.6}.side{fill:#f0f8f3;stroke:#8ebfa3;stroke-width:1.6}.pool{fill:#fff5e3;stroke:#d8b56a;stroke-width:1.6}.plain{fill:#fff;stroke:#c3cfdb;stroke-width:1.6}.target{fill:#f4efff;stroke:#b09bd8;stroke-width:1.6}.trunk{fill:#e8f6f6;stroke:#77b5b5;stroke-width:1.6}</style></defs>
<rect width="1480" height="1685" rx="20" fill="#f7f9fc"/><text x="45" y="48" class="title" text-anchor="start">Entity encoders + recurrent actor-critic</text><text x="45" y="81" class="sub" text-anchor="start">432 state features | shared layers run separately on each side | six action components</text><rect x="910" y="105" width="155" height="35" rx="10" class="shared"/><text x="987.5" y="129.5" class="small" text-anchor="middle">Shared weights</text><rect x="1085" y="105" width="155" height="35" rx="10" class="side"/><text x="1162.5" y="129.5" class="small" text-anchor="middle">Separate weights</text><rect x="1260" y="105" width="165" height="35" rx="10" class="pool"/><text x="1342.5" y="129.5" class="small" text-anchor="middle">Max pooling</text><text x="180" y="132" class="small" text-anchor="middle">INPUT GROUPS</text><text x="565" y="132" class="small" text-anchor="middle">SHARED / INDEPENDENT FC LAYERS</text><rect x="30" y="155" width="1395" height="210" rx="13" fill="#fff" stroke="#dde5ee"/><text x="52" y="182" class="label" text-anchor="start">HEROES | public state + hero-specific features</text><rect x="60" y="207" width="250" height="62" rx="10" class="plain"/><text x="185" y="232.5" class="body" text-anchor="middle">Main: 81 + 15 + 6</text><text x="185" y="257.5" class="body" text-anchor="middle">102 features</text><rect x="60" y="285" width="250" height="62" rx="10" class="plain"/><text x="185" y="310.5" class="body" text-anchor="middle">Enemy: 81 + 15 + 6</text><text x="185" y="335.5" class="body" text-anchor="middle">102 features</text><rect x="360" y="242" width="180" height="76" rx="10" class="shared"/><text x="450" y="274.5" class="body" text-anchor="middle">FC + ReLU</text><text x="450" y="299.5" class="body" text-anchor="middle">102 → 512</text><rect x="590" y="242" width="180" height="76" rx="10" class="shared"/><text x="680" y="274.5" class="body" text-anchor="middle">FC + ReLU</text><text x="680" y="299.5" class="body" text-anchor="middle">512 → 256</text><path d="M310 238 H335 V280 H360" class="line" marker-end="url(#arrow)"/><path d="M310 316 H335 V280" class="line"/><path d="M540 280 H590" class="line" marker-end="url(#arrow)"/><rect x="820" y="207" width="180" height="62" rx="10" class="side"/><text x="910" y="232.5" class="body" text-anchor="middle">Main FC + ReLU</text><text x="910" y="257.5" class="body" text-anchor="middle">256 → 128</text><rect x="820" y="285" width="180" height="62" rx="10" class="side"/><text x="910" y="310.5" class="body" text-anchor="middle">Enemy FC + ReLU</text><text x="910" y="335.5" class="body" text-anchor="middle">256 → 128</text><path d="M770 280 H795 V238 H820" class="line" marker-end="url(#arrow)"/><path d="M795 280 V316 H820" class="line" marker-end="url(#arrow)"/><rect x="1050" y="207" width="190" height="62" rx="10" class="plain"/><text x="1145" y="232.5" class="body" text-anchor="middle">Main hero</text><text x="1145" y="257.5" class="body" text-anchor="middle">128</text><rect x="1050" y="285" width="190" height="62" rx="10" class="plain"/><text x="1145" y="310.5" class="body" text-anchor="middle">Enemy hero</text><text x="1145" y="335.5" class="body" text-anchor="middle">128</text><path d="M1000 238 H1050" class="line" marker-end="url(#arrow)"/><path d="M1000 316 H1050" class="line" marker-end="url(#arrow)"/><path d="M1240 238 H1435" class="line"/><path d="M1240 316 H1435" class="line"/><text x="1285" y="266" class="small" text-anchor="middle">last 32</text><text x="1285" y="286" class="small" text-anchor="middle">to target</text><rect x="30" y="385" width="1395" height="225" rx="13" fill="#fff" stroke="#dde5ee"/><text x="52" y="412" class="label" text-anchor="start">MINIONS | 4 live units per side, nearest to the main hero; zero-pad missing slots</text><rect x="60" y="435" width="250" height="62" rx="10" class="plain"/><text x="185" y="460.5" class="body" text-anchor="middle">Main minions</text><text x="185" y="485.5" class="body" text-anchor="middle">4 × 19</text><rect x="60" y="513" width="250" height="62" rx="10" class="plain"/><text x="185" y="538.5" class="body" text-anchor="middle">Enemy minions</text><text x="185" y="563.5" class="body" text-anchor="middle">4 × 19</text><rect x="360" y="470" width="180" height="76" rx="10" class="shared"/><text x="450" y="502.5" class="body" text-anchor="middle">FC + ReLU</text><text x="450" y="527.5" class="body" text-anchor="middle">19 → 64</text><rect x="590" y="470" width="180" height="76" rx="10" class="shared"/><text x="680" y="502.5" class="body" text-anchor="middle">FC + ReLU</text><text x="680" y="527.5" class="body" text-anchor="middle">64 → 64</text><path d="M310 466 H335 V508 H360" class="line" marker-end="url(#arrow)"/><path d="M310 544 H335 V508" class="line"/><path d="M540 508 H590" class="line" marker-end="url(#arrow)"/><rect x="820" y="435" width="180" height="62" rx="10" class="side"/><text x="910" y="460.5" class="body" text-anchor="middle">Main FC + ReLU</text><text x="910" y="485.5" class="body" text-anchor="middle">64 → 32</text><rect x="820" y="513" width="180" height="62" rx="10" class="side"/><text x="910" y="538.5" class="body" text-anchor="middle">Enemy FC + ReLU</text><text x="910" y="563.5" class="body" text-anchor="middle">64 → 32</text><path d="M770 508 H795 V466 H820" class="line" marker-end="url(#arrow)"/><path d="M795 508 V544 H820" class="line" marker-end="url(#arrow)"/><rect x="1050" y="435" width="190" height="62" rx="10" class="pool"/><text x="1145" y="460.5" class="body" text-anchor="middle">Max over 4 slots</text><text x="1145" y="485.5" class="body" text-anchor="middle">4 × 32 → 32</text><rect x="1050" y="513" width="190" height="62" rx="10" class="pool"/><text x="1145" y="538.5" class="body" text-anchor="middle">Max over 4 slots</text><text x="1145" y="563.5" class="body" text-anchor="middle">4 × 32 → 32</text><path d="M1000 466 H1050" class="line" marker-end="url(#arrow)"/><path d="M1000 544 H1050" class="line" marker-end="url(#arrow)"/><path d="M1240 466 H1435" class="line"/><path d="M1240 544 H1435" class="line"/><text x="910" y="596" class="small" text-anchor="middle">Enemy 4 × 32 embeddings also feed the target scorer BEFORE pooling</text><rect x="30" y="630" width="1395" height="205" rx="13" fill="#fff" stroke="#dde5ee"/><text x="52" y="657" class="label" text-anchor="start">TOWERS | one tower per side; no pooling</text><rect x="60" y="679" width="250" height="62" rx="10" class="plain"/><text x="185" y="704.5" class="body" text-anchor="middle">Main tower</text><text x="185" y="729.5" class="body" text-anchor="middle">18</text><rect x="60" y="757" width="250" height="62" rx="10" class="plain"/><text x="185" y="782.5" class="body" text-anchor="middle">Enemy tower</text><text x="185" y="807.5" class="body" text-anchor="middle">18</text><rect x="360" y="715" width="180" height="76" rx="10" class="shared"/><text x="450" y="747.5" class="body" text-anchor="middle">FC + ReLU</text><text x="450" y="772.5" class="body" text-anchor="middle">18 → 64</text><rect x="590" y="715" width="180" height="76" rx="10" class="shared"/><text x="680" y="747.5" class="body" text-anchor="middle">FC + ReLU</text><text x="680" y="772.5" class="body" text-anchor="middle">64 → 64</text><path d="M310 710 H335 V753 H360" class="line" marker-end="url(#arrow)"/><path d="M310 788 H335 V753" class="line"/><path d="M540 753 H590" class="line" marker-end="url(#arrow)"/><rect x="820" y="679" width="180" height="62" rx="10" class="side"/><text x="910" y="704.5" class="body" text-anchor="middle">Main FC + ReLU</text><text x="910" y="729.5" class="body" text-anchor="middle">64 → 32</text><rect x="820" y="757" width="180" height="62" rx="10" class="side"/><text x="910" y="782.5" class="body" text-anchor="middle">Enemy FC + ReLU</text><text x="910" y="807.5" class="body" text-anchor="middle">64 → 32</text><path d="M770 753 H795 V710 H820" class="line" marker-end="url(#arrow)"/><path d="M795 753 V788 H820" class="line" marker-end="url(#arrow)"/><rect x="1050" y="679" width="190" height="62" rx="10" class="plain"/><text x="1145" y="704.5" class="body" text-anchor="middle">Main tower</text><text x="1145" y="729.5" class="body" text-anchor="middle">32</text><rect x="1050" y="757" width="190" height="62" rx="10" class="plain"/><text x="1145" y="782.5" class="body" text-anchor="middle">Enemy tower</text><text x="1145" y="807.5" class="body" text-anchor="middle">32</text><path d="M1000 710 H1050" class="line" marker-end="url(#arrow)"/><path d="M1000 788 H1050" class="line" marker-end="url(#arrow)"/><path d="M1240 710 H1435" class="line"/><path d="M1240 788 H1435" class="line"/><rect x="30" y="855" width="1395" height="125" rx="13" fill="#fff" stroke="#dde5ee"/><text x="52" y="882" class="label" text-anchor="start">MONSTER | one neutral-object slot; independent encoder, no pooling</text><rect x="60" y="905" width="250" height="58" rx="10" class="plain"/><text x="185" y="941" class="body" text-anchor="middle">Monster: 18</text><rect x="360" y="905" width="180" height="58" rx="10" class="side"/><text x="450" y="941" class="body" text-anchor="middle">18 → 64</text><rect x="590" y="905" width="180" height="58" rx="10" class="side"/><text x="680" y="941" class="body" text-anchor="middle">64 → 64</text><rect x="820" y="905" width="180" height="58" rx="10" class="side"/><text x="910" y="941" class="body" text-anchor="middle">64 → 32</text><rect x="1050" y="905" width="190" height="58" rx="10" class="plain"/><text x="1145" y="941" class="body" text-anchor="middle">Monster: 32</text><path d="M310 934 H360" class="line" marker-end="url(#arrow)"/><path d="M540 934 H590" class="line" marker-end="url(#arrow)"/><path d="M770 934 H820" class="line" marker-end="url(#arrow)"/><path d="M1000 934 H1050" class="line" marker-end="url(#arrow)"/><path d="M1240 934 H1435" class="line"/><rect x="30" y="1000" width="1395" height="165" rx="13" fill="#fff" stroke="#dde5ee"/><text x="52" y="1027" class="label" text-anchor="start">CONTEXT | independent local-combat encoder + direct global features</text><rect x="60" y="1047" width="250" height="52" rx="10" class="plain"/><text x="185" y="1080" class="body" text-anchor="middle">Local combat: 13</text><rect x="360" y="1047" width="180" height="52" rx="10" class="side"/><text x="450" y="1080" class="body" text-anchor="middle">13 → 64</text><rect x="590" y="1047" width="180" height="52" rx="10" class="side"/><text x="680" y="1080" class="body" text-anchor="middle">64 → 32</text><rect x="820" y="1047" width="180" height="52" rx="10" class="side"/><text x="910" y="1080" class="body" text-anchor="middle">32 → 16</text><rect x="1050" y="1047" width="190" height="52" rx="10" class="plain"/><text x="1145" y="1080" class="body" text-anchor="middle">Local combat: 16</text><path d="M310 1073 H360" class="line" marker-end="url(#arrow)"/><path d="M540 1073 H590" class="line" marker-end="url(#arrow)"/><path d="M770 1073 H820" class="line" marker-end="url(#arrow)"/><path d="M1000 1073 H1050" class="line" marker-end="url(#arrow)"/><path d="M1240 1073 H1435" class="line"/><rect x="60" y="1110" width="250" height="38" rx="10" class="plain"/><text x="185" y="1136" class="body" text-anchor="middle">Global game: 9</text><path d="M310 1129 H1050" class="line" marker-end="url(#arrow)"/><rect x="1050" y="1110" width="190" height="38" rx="10" class="plain"/><text x="1145" y="1136" class="body" text-anchor="middle">Direct: 9</text><path d="M1240 1129 H1435" class="line"/><path d="M1435 238 V1185 H190 V1210" class="line" marker-end="url(#arrow)"/><rect x="60" y="1210" width="260" height="95" rx="10" class="trunk"/><text x="190" y="1239.5" class="body" text-anchor="middle">Concatenate: 441</text><text x="190" y="1264.5" class="body" text-anchor="middle">256 + 64 + 64</text><text x="190" y="1289.5" class="body" text-anchor="middle">+ 32 + 16 + 9</text><rect x="380" y="1210" width="230" height="95" rx="10" class="trunk"/><text x="495" y="1252" class="body" text-anchor="middle">FC + ReLU</text><text x="495" y="1277" class="body" text-anchor="middle">441 → 512</text><path d="M320 1257 H380" class="line" marker-end="url(#arrow)"/><rect x="670" y="1210" width="330" height="95" rx="10" class="trunk"/><text x="835" y="1239.5" class="body" text-anchor="middle">1-layer LSTM</text><text x="835" y="1264.5" class="body" text-anchor="middle">input 512 / hidden 512</text><text x="835" y="1289.5" class="body" text-anchor="middle">train T=16 | infer T=1</text><path d="M610 1257 H670" class="line" marker-end="url(#arrow)"/><rect x="1050" y="1210" width="355" height="95" rx="10" class="plain"/><text x="1227.5" y="1239.5" class="body" text-anchor="middle">Recurrent state: h, c</text><text x="1227.5" y="1264.5" class="body" text-anchor="middle">512 values each</text><text x="1227.5" y="1289.5" class="body" text-anchor="middle">carried between inference steps</text><path d="M1000 1257 H1050" class="line" stroke-dasharray="6 5"/><path d="M835 1305 V1355 H130 V1400" class="line" marker-end="url(#arrow)"/><path d="M130 1355 H1335" class="line"/><rect x="50" y="1400" width="160" height="85" rx="10" class="plain"/><text x="130" y="1424.5" class="body" text-anchor="middle">Button</text><text x="130" y="1449.5" class="body" text-anchor="middle">Linear</text><text x="130" y="1474.5" class="body" text-anchor="middle">512 → 12</text><text x="130" y="1511" class="body" text-anchor="middle">12 logits</text><rect x="240" y="1400" width="160" height="85" rx="10" class="plain"/><text x="320" y="1424.5" class="body" text-anchor="middle">Move X</text><text x="320" y="1449.5" class="body" text-anchor="middle">Linear</text><text x="320" y="1474.5" class="body" text-anchor="middle">512 → 16</text><path d="M320 1355 V1400" class="line" marker-end="url(#arrow)"/><text x="320" y="1511" class="body" text-anchor="middle">16 logits</text><rect x="430" y="1400" width="160" height="85" rx="10" class="plain"/><text x="510" y="1424.5" class="body" text-anchor="middle">Move Z</text><text x="510" y="1449.5" class="body" text-anchor="middle">Linear</text><text x="510" y="1474.5" class="body" text-anchor="middle">512 → 16</text><path d="M510 1355 V1400" class="line" marker-end="url(#arrow)"/><text x="510" y="1511" class="body" text-anchor="middle">16 logits</text><rect x="620" y="1400" width="160" height="85" rx="10" class="plain"/><text x="700" y="1424.5" class="body" text-anchor="middle">Skill X</text><text x="700" y="1449.5" class="body" text-anchor="middle">Linear</text><text x="700" y="1474.5" class="body" text-anchor="middle">512 → 16</text><path d="M700 1355 V1400" class="line" marker-end="url(#arrow)"/><text x="700" y="1511" class="body" text-anchor="middle">16 logits</text><rect x="810" y="1400" width="160" height="85" rx="10" class="plain"/><text x="890" y="1424.5" class="body" text-anchor="middle">Skill Z</text><text x="890" y="1449.5" class="body" text-anchor="middle">Linear</text><text x="890" y="1474.5" class="body" text-anchor="middle">512 → 16</text><path d="M890 1355 V1400" class="line" marker-end="url(#arrow)"/><text x="890" y="1511" class="body" text-anchor="middle">16 logits</text><rect x="1000" y="1400" width="205" height="85" rx="10" class="target"/><text x="1102.5" y="1424.5" class="body" text-anchor="middle">Target scorer</text><text x="1102.5" y="1449.5" class="body" text-anchor="middle">32-D dot product</text><text x="1102.5" y="1474.5" class="body" text-anchor="middle">see detail figure</text><path d="M1102 1355 V1400" class="line" marker-end="url(#arrow)"/><text x="1102" y="1511" class="body" text-anchor="middle">9 logits</text><rect x="1240" y="1400" width="190" height="62" rx="10" class="plain"/><text x="1335" y="1425.5" class="body" text-anchor="middle">Value FC + ReLU</text><text x="1335" y="1450.5" class="body" text-anchor="middle">512 → 64</text><path d="M1335 1355 V1400" class="line" marker-end="url(#arrow)"/><rect x="1240" y="1485" width="190" height="52" rx="10" class="plain"/><text x="1335" y="1518" class="body" text-anchor="middle">Linear 64 → 1</text><path d="M1335 1462 V1485" class="line" marker-end="url(#arrow)"/><text x="735" y="1580" class="body" text-anchor="middle">Policy outputs: [12, 16, 16, 16, 16, 9] = 85 logits | Value output: 1</text><text x="735" y="1615" class="sub" text-anchor="middle">All encoder FC layers use ReLU; policy logits and the final value are linear.</text><text x="735" y="1649" class="sub" text-anchor="middle">Legal-action masks are applied after scoring and are separate from the 432-D state input.</text></svg>
