[feature_config]
# This config is for the current MonsterProcess class.
# File name in your code is organ_feature_config.ini, but the ranges below use
# the official Mojia Map soldier / creep normalization coefficients.

# visibility / alive
is_alive = one_hot:1:eq
is_visible = one_hot:1:eq

# global position, using soldier_vec_feature ranges
location_x = min_max:-10000:10000
location_z = min_max:-41000:41000

# relative position
# NOTE: your functions relative_location_x/z already convert diff into [0, 1]
# via (diff + 15000) / 30000. This min_max keeps/clips that normalized value.
main_relative_location_x = min_max:0:1
main_relative_location_z = min_max:0:1
enemy_relative_location_x = min_max:0:1
enemy_relative_location_z = min_max:0:1

# distance to main / enemy hero, using soldier dist_from_each_hero range
dist_to_main_hero = min_max:0:116000
dist_to_enemy_hero = min_max:0:116000

# hp / income, using soldier_vec_feature ranges
hp = min_max:0:12000
hp_rate = min_max:0:1
max_hp = min_max:0:12000
kill_income = min_max:0:150

# 是否正在攻击这个怪物
main_is_attacking_this_unit = one_hot:1:eq
enemy_is_attacking_this_unit = one_hot:1:eq

# 是否在我方和敌方英雄攻击范围内
main_hero_in_attack_range = one_hot:1:eq
enemy_hero_in_attack_range = one_hot:1:eq


[feature_functions]
# visibility / alive
is_alive = is_alive
is_visible = is_visible

# global position
location_x = get_normal_organ_location_x
location_z = get_normal_organ_location_z

# relative position
main_relative_location_x = main_relative_location_x
main_relative_location_z = enemy_relative_location_z
enemy_relative_location_x = enemy_relative_location_x
enemy_relative_location_z = enemy_relative_location_z

# distance to heroes
dist_to_main_hero = dist_to_main_hero
dist_to_enemy_hero = dist_to_enemy_hero

# hp / income
hp = hp
hp_rate = hp_rate
max_hp = max_hp
kill_income = kill_income

# 是否正在攻击这个怪物
main_is_attacking_this_unit = main_is_attacking_this_unit
enemy_is_attacking_this_unit = enemy_is_attacking_this_unit

# 是否在我方和敌方攻击范围内
main_hero_in_attack_range = main_hero_in_attack_range
enemy_hero_in_attack_range = enemy_hero_in_attack_range

